server:
  port: 8080
  servlet:
    context-path: /messaging-service

socket-server:
  host: localhost
  port: 8081

redis:
  host: localhost
  port: 6379

spring:
  # Postgresql Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blossom?currentSchema=messaging-service&rewriteBatchedStatements=true
    username: user
    password: password

  jpa:
    show-sql: true
    hibernate:
      show_sql: true
      format_sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_batch_fetch_size: 1000
      hibernate.hbm2ddl.auto: none
      default_schema: message-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/watermelon-test

jwt:
  secret: de5adebf66b7b94b007ca46403cf797c92eb63d9c55e70239cf927dfaac15211
  expiration_date: 8640000


logging:
  level:
    com.corundumstudio.socketio: debug
    web: debug

modules:
  endpoints:
    user-service:
    recommend-service:
    relation-service:
    messaging-service:
