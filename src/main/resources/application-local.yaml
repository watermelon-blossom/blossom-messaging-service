server:
  port: 8080
  servlet:
    context-path: /messaging-service

socket-server:
  port: 8081
  host: localhost

spring:
  # Postgresql Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blossom?currentSchema=messaging-service&rewriteBatchedStatements=true
    username: user
    password: password

  jpa:
    show-sql: true
    hibernate:
      show_sql: true
      format_sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_batch_fetch_size: 1000
      hibernate.hbm2ddl.auto: none
  data:
    mongodb:
      uri: mongodb://localhost:27017/watermelon-test

  kafka:
    topic:
      names: message
    bootstrap-servers: localhost:9092, localhost:9093, localhost:9094
    listener:
      type: batch
      concurrency: 1
      ack-mode: batch
    consumer:
      group-id: ${random.uuid}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer


logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

modules:
  endpoints:
    user-service:
    recommend-service:
    relation-service:
    messaging-service:
