server:
  port: 8080
  servlet:
    context-path: /messaging-service

spring:
  # Postgresql Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/blossom?currentSchema=messaging-service&rewriteBatchedStatements=true
    username: postgres
    password:

  jpa:
    show-sql: true
    hibernate:
      show_sql: true
      format_sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_batch_fetch_size: 1000
      hibernate.hbm2ddl.auto: create
  data:
    mongodb:
      uri: mongodb+srv://joonhyeok:thMKGJ2S8bIOdWx4@cluster0.q4gkldd.mongodb.net/watermelon-test

  kafka:
    topic:
      names: message
    bootstrap-servers: localhost:9092, localhost:9093, localhost:9094
    listener:
      type: batch
      concurrency: 1
      ack-mode: batch
    consumer:
      group-id: ${random.uuid}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties.session.timeout.ms: 45000
    properties.sasl.mechanism: PLAIN
    properties.sasl.jaas.config: nada
    properties.security.protocol: SASL_SSL

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace
    web: debug

modules:
  endpoints:
    user-service:
    recommend-service:
    relation-service:
    messaging-service:
