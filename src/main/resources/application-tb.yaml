server:
  port: 8080
  servlet:
    context-path: /messaging-service

socket-server:
  port: 8081
  host: 0.0.0.0

spring:
  # Postgresql Config
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      show_sql: true
      format_sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.default_batch_fetch_size: 1000
      hibernate.hbm2ddl.auto: create

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}



  kafka:
    topic:
      names: message
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAPSERVERS}
    listener:
      type: batch
      concurrency: 1
      ack-mode: batch
    consumer:
      group-id: ${random.uuid}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties.sasl.mechanism: PLAIN
    properties.sasl.jaas.config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}
    properties.security.protocol: SASL_SSL
    properties.session.timeout.ms: 45000


logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

modules:
  endpoints:
    user-service:
    recommend-service:
    relation-service:
    messaging-service:

