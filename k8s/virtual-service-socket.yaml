apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: messaging-virtualservice
  namespace: backend
spec:
  hosts:
    - "*"
  gateways:
    - istio-system/default-gateway
  http:
    - match:
        - uri:
            prefix: /messaging-service-socket
      #      rewrite:
      #        uri: /
      route:
        - destination:
            port:
              number: 8081
            host: messaging-service-head.backend.svc.cluster.local
